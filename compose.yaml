name: patente
services:
  identity-init:
    image: localhost/patente_backend:latest
    command: [node, dist/cli.js, setup]
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:/data/patente.db}
      AUTH_USERS_FILE: /identity/users.yml
      SETUP_RUNTIME: /runtime
    volumes:
      - backend-data:/data
      - identity-data:/identity
      - ./infra/runtime:/runtime
  backend:
    image: localhost/patente_backend:latest
    build: ./src/modules/backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:/data/patente.db}
      AUTH_USERS_FILE: /identity/users.yml
      APP_ORIGIN: ${APP_ORIGIN:?Set the public HTTPS application origin}
      API_ORIGIN: ${API_ORIGIN:?Set the browser application origin}
      APP_BASE_PATH: ${APP_BASE_PATH:-}
      AUTH_COOKIE_HOST_ONLY: ${AUTH_COOKIE_HOST_ONLY:-false}
      AUTHELIA_URL: http://authelia:9091
      NATS_URL: nats://nats:4222
      NATS_TOKEN: ${NATS_TOKEN:?Set NATS_TOKEN in the server-local .env}
    ports:
      - '127.0.0.1:${BACKEND_PORT:-3000}:3000'
    volumes:
      - backend-data:/data
      - identity-data:/identity
    depends_on:
      identity-init:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
      authelia:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:3000/health]
      interval: 15s
      timeout: 5s
      start_period: 30s
  nats:
    image: localhost/patente_nats:latest
    build: ./infra/nats
    restart: unless-stopped
    environment:
      NATS_TOKEN: ${NATS_TOKEN:?Set NATS_TOKEN in the server-local .env}
    volumes:
      - nats-data:/data
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8222/healthz]
      interval: 5s
      timeout: 3s
  authelia:
    image: localhost/patente_authelia:latest
    build: ./infra/authelia
    restart: unless-stopped
    environment:
      X_AUTHELIA_CONFIG_FILTERS: template
      GOMEMLIMIT: 48MiB
      GOGC: '25'
      AUTHELIA_NTP_DISABLE_FAILURE: ${AUTHELIA_NTP_DISABLE_FAILURE:-false}
      APP_ORIGIN: ${APP_ORIGIN:?Set APP_ORIGIN}
      APP_BASE_PATH: ${APP_BASE_PATH:-}
      AUTH_ORIGIN: ${AUTH_ORIGIN:?Set the public HTTPS authentication origin}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:?Set the common application/auth cookie domain}
      APP_HOST: ${APP_HOST:?Set the application hostname}
      AUTHELIA_SESSION_SECRET: ${AUTHELIA_SESSION_SECRET:?Set AUTHELIA_SESSION_SECRET}
      AUTHELIA_STORAGE_ENCRYPTION_KEY: ${AUTHELIA_STORAGE_ENCRYPTION_KEY:?Set AUTHELIA_STORAGE_ENCRYPTION_KEY}
      AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET: ${AUTHELIA_JWT_SECRET:?Set AUTHELIA_JWT_SECRET}
    ports:
      - '127.0.0.1:${AUTHELIA_PORT:-9091}:9091'
    volumes:
      - identity-data:/identity
      - authelia-data:/data
    depends_on:
      identity-init:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, /app/healthcheck.sh]
      interval: 5s
      timeout: 3s
      start_period: 30s
volumes:
  backend-data:
  identity-data:
  nats-data:
  authelia-data:
