# Include inside the existing ssccss.cc server block.
# External HTTPS terminates at Cloudflare; the origin connection uses HTTP.
location = /driving24 { return 302 /driving24/; }
location = /driving24auth { return 302 /driving24auth/; }

location ^~ /driving24auth/ {
    proxy_pass http://127.0.0.1:19091;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store" always;
}

location ^~ /driving24/api/ {
    proxy_pass http://127.0.0.1:13000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store" always;
}

location = /driving24/health {
    proxy_pass http://127.0.0.1:13000/health;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store" always;
}

# Preserve /driving24: the container serves both HTML entries and assets.
location ^~ /driving24/ {
    proxy_pass http://127.0.0.1:18080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
